[project]
name = "worldmap-api"
version = "0.1.0"
description = "WorldMap AI — Geospatial calculation API"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests"]
filterwarnings = ["ignore::DeprecationWarning"]
